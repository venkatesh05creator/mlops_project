version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: traffic_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-traffic_analytics}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-traffic_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
